services:

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_DATABASE: myapp
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD} 
      JWT_REF_EXPIRATION: ${JWT_REF_EXPIRATION} 
      JWT_EXPIRATION: ${JWT_EXPIRATION} 
      JWT_SECRET: ${JWT_SECRET}
  
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  myapp:
    image: myapp:latest
    container_name: myapp_con_com
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: example
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD} 
      JWT_REF_EXPIRATION: ${JWT_REF_EXPIRATION} 
      JWT_EXPIRATION: ${JWT_EXPIRATION} 
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mysql
      - redis

volumes:
  mysql-data:
    external: true
